# rules.yaml
# DEFAULTS. /setup copies this to my-data/rules.yaml; edit that copy, skills read it first.
# WHAT TO DO once a role is scored. Every rule is a switch you can turn off.
# score.py enforces: no_easy_apply, big_brand_contact_only, priority_keywords_first, ask_budget_on_first_call.
# tracker.py enforces: follow_up_then_close. Claude applies the rest when running the skills.
#
# These defaults are lessons from a real job search, written as starting points, not laws.
# Your market and role may differ: /retro re-checks each rule against YOUR outcomes and tells you
# which to keep.

rules:

  no_easy_apply:
    enabled: true
    what: >
      Job boards, aggregators and one-click "Easy Apply" are for DISCOVERY only.
      Apply on the company's own careers page (ATS) and reach a named human.
      Exception: the board is the only published route and the role scores apply-band.
    why: "One-click applications land in a pile nobody reads. They almost never reach a person."

  big_brand_contact_only:
    enabled: true
    brands: ["Google", "Amazon", "Microsoft", "Meta", "Apple", "Salesforce", "Adobe", "Uber", "JPMorgan Chase"]
    max_open_applications_per_brand: 1   # applied by Claude in /score and /briefing, not by score.py
    what: >
      For very large brands, apply only when a recruiter reached out, a hiring
      manager is named and reachable, or a referrer sits on the hiring team.
    why: >
      Big brands get the most applicants per role, so a cold application rarely reaches a person,
      and they take the longest to prepare. Your time goes further at mid-size companies or through
      someone inside. Turn it off if you disagree.

  priority_keywords_first:
    enabled: true
    keywords: []          # titles containing these rank first at equal fit, e.g. ["platform", "growth"] or ["backend", "infra"]
    min_share_per_week: 0.4              # checked by Claude in /retro, not by a script
    what: "Roles in your strongest niche go to the top of the queue at equal fit."
    why: "Roles that match your strongest niche convert far better than generic titles."

  tailor_only_with_trigger:
    enabled: true
    triggers:
      - "A top-3 JD requirement is missing from the resume variant you would send"
      - "The JD is a builder/IC role and your variant leads with team size (or the reverse)"
      - "Right domain, wrong slice (e.g. variant is about acquisition, role is about retention)"
      - "Dream company, or someone is spending their reputation on a referral"
    what: "Default is your best master variant plus a sharp cover note. Tailor only when a trigger fires."

  warm_asks_over_volume:
    enabled: true
    warm_asks_per_week_floor: 5      # referral requests or notes to named hiring managers / recruiters
    cold_applications_per_week_cap: 10
    max_contacts_per_company_per_week: 2   # don't message three people on one team in a week
    what: "Measure the week by warm asks sent, not applications fired. Log each ask with `tracker.py ask`."
    why: >
      A referral or a note to a named person reaches a human far more often than a portal application.
      (Part of that gap is that people ask for referrals on roles that already fit better.)

  follow_up_then_close:
    enabled: true
    nudge_on_day: 7          # one note to a named human between day 7 and 10
    close_on_day: 14         # earliest auto-close. US/UK processes are slower: try 21-28
    close_days_after_nudge: 7   # and never sooner than this many days after your nudge
    stale_in_process_days: 10   # flag a screen/interview with no news for this long
    what: >
      One follow-up, then let it go. "Closed" is an internal label that stops a dead application
      counting as active. A late reply still counts: just update the status.

  ask_budget_on_first_call:
    enabled: true
    what: >
      On the first recruiter call, once they've said you look like a fit, ask:
      "What range is budgeted for this level?" Never in a cold message.
      India: recruiters usually ask your current and expected CTC first; have your expected number ready
      and ask their range in return. US: many states require posted ranges and ban questions about your
      salary history. UK/EU: ask about the band; it's a normal question.
    why: "Finding out about a budget gap after five rounds wastes everyone's time."

  company_history_check:
    enabled: true
    silent_applications_before_contact_only: 3   # applied by Claude in /score, not by score.py
    what: "Three silent applications at one company = stop applying cold there; find a person."

  human_approves_everything:
    enabled: true            # do not turn this off
    what: "The kit never submits an application or sends a message. You do."

# Route priority: used to rank the day's queue AFTER gates and score.
# Relative starting weights (higher = more likely to reach a person). Guesses, not measurements:
# /retro replaces them with your own reply rates once each route has 10+ applications.
route_priority:
  referral: 5.0
  recruiter_inbound: 4.0
  named_human_plus_portal: 3.0
  company_portal: 1.5
  agency: 1.0
  job_board: 0.5
  easy_apply: 0.25
